<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Vibrant Enterprise Orange -->
    <linearGradient id="iconOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7A00" />
      <stop offset="100%" stop-color="#FF4D00" />
    </linearGradient>

    <filter id="iconGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#FF5500" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Squircle Base Card -->
  <rect x="6" y="6" width="244" height="244" rx="54" fill="url(#cardBg)" stroke="#334155" stroke-width="2" />

  <!-- Subtle Radial Ambient Glow behind Icon -->
  <circle cx="128" cy="128" r="75" fill="#FF5500" opacity="0.12" />

  <!-- Central Mizan Icon Mark (Option 1A: Integrated Tech Fulcrum) -->
  <g transform="translate(38, 42)">
    <!-- Base / Balance Shelves (Light Charcoal / White) -->
    <polygon points="5,115 50,115 42,130 0,130" fill="#F8FAFC" />
    <polygon points="130,115 175,115 180,130 138,130" fill="#F8FAFC" />

    <!-- Outer 'M' Geometric Frame (White / Slate) -->
    <polygon points="26,115 38,115 38,30 26,30" fill="#FFFFFF" />
    <polygon points="142,115 154,115 154,30 142,30" fill="#FFFFFF" />
    
    <!-- Top Chevrons -->
    <polygon points="26,30 38,30 78,85 66,85" fill="#FFFFFF" />
    <polygon points="154,30 142,30 102,85 114,85" fill="#FFFFFF" />

    <!-- Orange Precision Fulcrum & Pointer (Glowing) -->
    <g filter="url(#iconGlow)">
      <!-- Orange Chevrons -->
      <polygon points="90,72 68,38 80,30 90,46 100,30 112,38" fill="url(#iconOrange)" />
      
      <!-- Fulcrum Pivot Ring -->
      <circle cx="90" cy="102" r="13" fill="#0F172A" stroke="url(#iconOrange)" stroke-width="5" />
      <circle cx="90" cy="102" r="4.5" fill="#FFFFFF" />

      <!-- Lower Needle -->
      <polygon points="83,115 90,145 97,115" fill="url(#iconOrange)" />
    </g>
  </g>
</svg>