<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Rounded Squircle Base Card -->
  <rect x="2" y="2" width="252" height="252" rx="56" fill="#FAFAFA" stroke="#E8E8E8" stroke-width="2"/>
  
  <!-- Icon Graphics (Filled Vector Paths) -->

  <!-- POS Touch Screen Monitor Frame -->
  <rect x="58" y="44" width="140" height="100" rx="14" fill="#D51C1B"/>
  <!-- Screen Display Glass (White) -->
  <rect x="70" y="56" width="116" height="76" rx="8" fill="#FFFFFF"/>
  <!-- Order Items Rows -->
  <rect x="80" y="68" width="46" height="7" rx="3.5" fill="#D51C1B"/>
  <rect x="80" y="81" width="34" height="7" rx="3.5" fill="#D51C1B"/>
  <rect x="80" y="94" width="56" height="7" rx="3.5" fill="#D51C1B"/>
  <!-- Quick Buttons Grid -->
  <rect x="146" y="68" width="14" height="14" rx="3" fill="#EF5350"/>
  <rect x="164" y="68" width="14" height="14" rx="3" fill="#EF5350"/>
  <rect x="146" y="86" width="14" height="14" rx="3" fill="#EF5350"/>
  <rect x="164" y="86" width="14" height="14" rx="3" fill="#EF5350"/>
  <!-- Total Bar on Screen -->
  <rect x="80" y="108" width="98" height="16" rx="4" fill="#D51C1B"/>
  <!-- Stand Neck -->
  <polygon points="114,144 142,144 148,176 108,176" fill="#B71C1C"/>
  <!-- Counter Register Base -->
  <rect x="48" y="176" width="160" height="42" rx="10" fill="#D51C1B"/>
  <!-- Receipt Paper Dispenser Slot & Printed Ticket -->
  <rect x="68" y="184" width="44" height="5" rx="2.5" fill="#B71C1C"/>
  <rect x="72" y="189" width="36" height="14" fill="#FFFFFF"/>
  <rect x="76" y="193" width="28" height="2" fill="#D51C1B"/>
  <rect x="76" y="197" width="18" height="2" fill="#D51C1B"/>
  <!-- Base Indicator Lights -->
  <circle cx="168" cy="197" r="7" fill="#FFFFFF"/>
  <circle cx="186" cy="197" r="7" fill="#FFFFFF"/>

</svg>